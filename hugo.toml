baseURL = "https://therareplantguide.com/"
cleanDestinationDir = true
locale = "en_US"
title = "The Rare Plant Guide"
theme = "PaperMod"

[params]
  author = "The Rare Plant Guide"
  env = "production"
  description = "Rare houseplant care and troubleshooting guides for Monstera, Philodendron, Anthurium and other aroids: variegation, light, soil, root rot, pests and propagation."
  DateFormat = "January 2, 2006"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowWordCount = true
  ShowToc = true
  TocOpen = false
  ShowRssButtonInSectionTermList = true
  mainSections = ["posts"]
  images = ["images/og-cover.jpg"]

  [params.assets]
    disableHLJS = true
    favicon = "images/leaf-icon.png"
    favicon16x16 = "images/leaf-icon.png"
    favicon32x32 = "images/leaf-icon.png"
    apple_touch_icon = "images/leaf-icon.png"

  [params.label]
    text = "The Rare Plant Guide"
    icon = "images/leaf-icon.png"
    iconHeight = 28

  [params.homeInfoParams]
    Title = "Rare Houseplant Care — Diagnose Problems and Grow With Confidence 🌿"
    Content = "Practical help for Monstera, Philodendron, Anthurium and other rare aroids. Diagnose root rot, pests and reversion, improve light and soil, or learn propagation step by step. Start with the free Symptom Checker or choose a guide below."

[[params.socialIcons]]
  name = "pinterest"
  url = "https://www.pinterest.com/therareplantguide/"

[params.list]
  showFullTextinRSS = false

