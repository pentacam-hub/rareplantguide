baseURL = "https://therareplantguide.com/"
locale = "en_US"
title = "The Rare Plant Guide"
theme = "PaperMod"

[params]
  author = "The Rare Plant Guide"
  env = "production"
  description = "Practical rare houseplant care guides, troubleshooting advice, propagation tips and a free plant symptom checker."
  DateFormat = "January 2, 2006"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowWordCount = true
  ShowToc = true
  TocOpen = false
  ShowRssButtonInSectionTermList = true
  mainSections = ["posts"]
  images = ["images/og-cover.jpg"]

  [params.assets]
    disableHLJS = true

  [params.label]
    text = "The Rare Plant Guide"
    icon = "images/leaf-icon.png"
    iconHeight = 28

  [params.homeInfoParams]
    Title = "Keep Rare Houseplants Healthy — Without the Guesswork 🌿"
    Content = "Practical guides for rare and variegated houseplants: diagnose problems, prevent root rot, improve light and soil, and propagate with confidence. Start with the free Symptom Checker or explore the latest guides below."

[[params.socialIcons]]
  name = "pinterest"
  url = "https://www.pinterest.com/therareplantguide/"

[params.list]
  showFullTextinRSS = false

[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1
[[menu.main]]
  name = "Articles"
  url = "/posts/"
  weight = 2
[[menu.main]]
  name = "Symptom Checker"
  url = "/tools/symptom-checker.html"
  weight = 3
[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 4
[[menu.main]]
  name = "Contact"
  url = "/contact/"
  weight = 5
