guide-to-houseplant-variegation-chimeric-pattern-and-viral:
  eyebrow: "Variegation guide"
  quick_answer: "Variegation is not one single mechanism. Stable genetic patterns, chimeric growth and viral-looking damage can behave differently, so identify the pattern before assuming a care change will increase or restore color."
  quick_points:
    - "Read both leaves and stem tissue."
    - "Separate genetic patterns from damage or disease symptoms."
    - "Do not promise that light or fertilizer can manufacture variegation."
  visual_cards_title: "Different patterns need different interpretations"
