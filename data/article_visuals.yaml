how-to-spot-and-treat-philodendron-root-rot-before-it-s-too-late:
  eyebrow: "Problems & fixes"
  quick_answer: "Leaf yellowing alone does not prove root rot. Confirm the diagnosis at the root zone: soft dark roots, a sour smell, persistent saturation and collapsing tissue are much stronger evidence than leaf color by itself."
  quick_points:
    - "Inspect roots before treating the leaves."
    - "Remove soft, dead tissue with a sanitized tool."
    - "Correct the wet, low-oxygen root environment that caused the decline."
  visual_cards_title: "Healthy roots vs warning signs"
  visual_cards:
    - title: "Inspect the roots"
      text: "Firm roots and collapsing roots feel very different when handled."
      image: "/images/how-to-spot-and-treat-philodendron-root-rot-before-it-s-too-late.jpg"
    - title: "Check the mix"
      text: "Dense, saturated substrate can keep oxygen away from the root system."
      image: "/images/chunky-aroid-soil-mix.jpg"
    - title: "Do not diagnose from leaves alone"
      text: "Yellowing can come from several causes; use the root zone as evidence."
      image: "/images/plant-bright-window-light.jpg"
    - title: "Rebuild an airy root zone"
      text: "After removing damaged roots, use a pot and substrate matched to the remaining root mass."
      image: "/images/chunky-aroid-soil-mix1.jpg"
  action_steps:
    - title: "Unpot and inspect"
      text: "Look at actual roots before assuming a watering or nutrient problem."
      image: "/images/how-to-spot-and-treat-philodendron-root-rot-before-it-s-too-late.jpg"
    - title: "Remove dead tissue"
      text: "Trim only soft, dark or foul-smelling roots with a clean tool."
      image: "/images/plant-propagation-cutting.jpg"
    - title: "Reset the substrate"
      text: "Use an airy mix and a container sized to the remaining root system."
      image: "/images/chunky-aroid-soil-mix.jpg"
    - title: "Stabilize aftercare"
      text: "Avoid fertilizing or changing several environmental variables immediately."
      image: "/images/plant-bright-window-light.jpg"
  mistakes:
