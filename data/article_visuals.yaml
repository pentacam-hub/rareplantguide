best-soil-mix-variegated-monstera:
  eyebrow: "Soil & roots"
  quick_answer: "Start with a loose 40/30/20/10 mix: orchid bark, perlite or pumice, sphagnum or coco coir, then a small amount of potting mix or worm castings. The target is air plus moisture — not a dense pot of wet soil."
  quick_points:
    - "40% bark for structure and large air spaces."
    - "30% perlite or pumice for drainage and aeration."
    - "20% moisture-holding fibre and 10% finer base material."
  visual_cards_title: "Build the root zone by function"
  visual_cards:
    - title: "Chunky structure"
      text: "Bark keeps the root zone open instead of collapsing into a dense block."
      image: "/images/chunky-aroid-soil-mix.jpg"
    - title: "Mineral aeration"
      text: "Perlite or pumice creates drainage and reduces compaction."
      image: "/images/chunky-aroid-soil-mix1.jpg"
    - title: "Moisture balance"
      text: "A smaller sphagnum or coir fraction keeps the mix from drying instantly."
      image: "/images/is-sphagnum-moss-actually-the-holy-grail-for-rare-plant-propagation.jpg"
    - title: "Healthy roots"
      text: "The finished mix should drain freely and keep oxygen around thick aroid roots."
      image: "/images/propagation-water-rooting.jpg"
  action_title: "Adjust the recipe to your room"
  action_steps:
    - title: "Start chunky"
      text: "Use the 40/30/20/10 recipe as a baseline rather than a rigid rule."
      image: "/images/chunky-aroid-soil-mix.jpg"
    - title: "Watch drying speed"
      text: "Cool, humid rooms usually need more aeration than hot, dry rooms."
      image: "/images/humidity-tents-vs-greenhouse-cabinets-for-rare-plants.jpg"
    - title: "Match the pot"
      text: "Avoid a large volume of wet substrate around a small root system."
      image: "/images/chunky-aroid-soil-mix1.jpg"
    - title: "Read the roots"
      text: "If yellowing occurs in wet soil, inspect roots instead of guessing from leaves."
      image: "/images/how-to-spot-and-treat-philodendron-root-rot-before-it-s-too-late.jpg"
  mistakes:
    - title: "Using dense potting soil alone"
      text: "Fine material can stay saturated and lose air space around the roots."
    - title: "Packing sphagnum tightly"
      text: "Compressed moss can hold far more water than the plant needs."
    - title: "Oversizing the pot"
      text: "A large wet root zone dries slowly around a small plant."
    - title: "Copying a recipe blindly"
      text: "Humidity, light, pot material and watering habits change how the same mix behaves."
  visual_links:
    - title: "How Often to Water Variegated Monstera"
      text: "Decide when the chunky mix actually needs water."
      url: "/posts/how-often-to-water-variegated-monstera/"
      image: "/images/plant-bright-window-light.jpg"
    - title: "Root Rot Troubleshooting"
      text: "Use root condition to distinguish a wet-root problem from a leaf symptom."
      url: "/posts/how-to-spot-and-treat-philodendron-root-rot-before-it-s-too-late/"
      image: "/images/how-to-spot-and-treat-philodendron-root-rot-before-it-s-too-late.jpg"
    - title: "How to Propagate Variegated Monstera"
      text: "Move a rooted cutting into an airy mix without suffocating new roots."
      url: "/posts/propagate-variegated-monstera/"
      image: "/images/propagation-water-rooting.jpg"

propagate-variegated-monstera:
  eyebrow: "Propagation guide"
  quick_answer: "A viable node is non-negotiable. Choose firm stem tissue with a living growth point, root it in water or lightly damp sphagnum under stable bright indirect light, and pot only after several healthy roots have developed."
  quick_points:
    - "No viable node means no new Monstera vine."
    - "Keep the node hydrated but oxygenated."
    - "Judge progress from healthy roots, not a fixed number of days."
  visual_cards_title: "Choose the right starting material"
  visual_cards:
    - title: "Viable node"
      text: "Confirm the stem section and growth point before making the cut."
      image: "/images/monstera-node-vs-axillary-bud-comparison.webp"
    - title: "Clean cutting"
      text: "Use firm tissue and a sanitized blade; remove soft or dark material."
      image: "/images/plant-propagation-cutting.jpg"
    - title: "Water rooting"
      text: "Easy to inspect, but keep the container clean and avoid submerging unnecessary stem."
      image: "/images/propagation-water-rooting.jpg"
    - title: "Sphagnum rooting"
      text: "Keep long-fiber moss lightly damp and loose rather than compressed and wet."
      image: "/images/is-sphagnum-moss-actually-the-holy-grail-for-rare-plant-propagation.jpg"
  action_title: "From cutting to established roots"
  action_steps:
    - title: "Choose the node"
      text: "Pick a healthy node with a viable bud and useful stem variegation."
      image: "/images/monstera-node-vs-axillary-bud-comparison.webp"
    - title: "Make a clean cut"
      text: "Leave enough healthy stem around the node to handle it safely."
      image: "/images/plant-propagation-cutting.jpg"
    - title: "Root with oxygen"
      text: "Use clean water, loose sphagnum or another airy medium."
      image: "/images/propagation-water-rooting.jpg"
    - title: "Pot after branching roots"
      text: "Move to a small pot and chunky mix once the root system is established."
      image: "/images/chunky-aroid-soil-mix.jpg"
  mistakes:
    - title: "Starting without a node"
      text: "A leaf-only cutting cannot create a new vine."
    - title: "Submerging too much stem"
      text: "Keep only the necessary rooting area in contact with the medium."
    - title: "Packing moss tightly"
      text: "Air space around the node is essential."
    - title: "Potting after one tiny root"
      text: "A stronger, branching root system handles the transition better."
  visual_links:
    - title: "Monstera Node vs Axillary Bud"
      text: "Confirm the growth point before cutting."
      url: "/posts/monstera-node-vs-axillary-bud-variegated-cutting/"
      image: "/images/monstera-node-vs-axillary-bud-comparison.webp"
