monstera-node-vs-axillary-bud-variegated-cutting:
  eyebrow: "Propagation guide"
  quick_answer: "The node is the stem section that holds the plant's growth structures; the axillary bud is the small growth point that can activate into a new vine. A valuable cutting needs a viable node and living growth tissue, not just a leaf or aerial root."
  quick_points:
    - "Find the swollen node on the main stem first."
    - "Look for the small axillary bud at or just above that node."
    - "An aerial root helps with rooting, but it is not the growth point."
  visual_cards_title: "Node, bud, root and petiole — do not confuse them"
  visual_cards:
    - title: "Node"
      text: "The stem section where the leaf, bud and often an aerial root originate."
      image: "/images/monstera-node-vs-axillary-bud-comparison.webp"
    - title: "Axillary bud"
      text: "The dormant growth point that can become the next vine."
      image: "/images/plant-propagation-cutting.jpg"
    - title: "Aerial root"
      text: "A rooting and anchoring structure. Useful, but not a replacement for a bud."
      image: "/images/propagation-water-rooting.jpg"
    - title: "Stem variegation"
      text: "Check where cream and green tissue cross the node before choosing a variegated cutting."
      image: "/images/variegation-pattern-close.jpg"
  action_title: "Inspect a cutting in this order"
  action_steps:
    - title: "Find the node"
      text: "Locate the real stem section rather than judging the leaf alone."
      image: "/images/monstera-node-vs-axillary-bud-comparison.webp"
    - title: "Find the bud"
      text: "Confirm that living growth tissue is present before buying or cutting."
      image: "/images/plant-propagation-cutting.jpg"
    - title: "Check stem health"
      text: "Avoid soft, black or collapsing tissue around the node."
      image: "/images/propagation-water-rooting.jpg"
    - title: "Read variegation"
      text: "For Albo-type plants, inspect striping around the bud instead of chasing the whitest leaf."
      image: "/images/variegation-pattern-close.jpg"
  mistakes:
    - title: "Buying a leaf-only cutting"
      text: "A beautiful leaf without viable stem growth tissue cannot produce a new vine."
    - title: "Mistaking an aerial root for a bud"
      text: "Roots and buds can sit near the same node but have different jobs."
    - title: "Cutting through the node"
      text: "Leave healthy stem around the node so the bud is not damaged."
    - title: "Choosing by leaf color alone"
      text: "The stem and growth point matter more than the current leaf pattern."
  visual_links:
    - title: "How to Propagate Variegated Monstera"
      text: "Root a viable node in water, sphagnum or another airy medium."
      url: "/posts/propagate-variegated-monstera/"
      image: "/images/propagation-water-rooting.jpg"
    - title: "Where to Cut a Reverting Monstera"
      text: "Choose the lower growth point before making a corrective cut."
      url: "/posts/where-to-cut-reverting-variegated-monstera/"
      image: "/images/monstera-reverted-green.jpg"
    - title: "Best Soil for Variegated Monstera"
      text: "Pot a rooted cutting into an airy, chunky root zone."
      url: "/posts/best-soil-mix-variegated-monstera/"
      image: "/images/chunky-aroid-soil-mix.jpg"

the-heartbreak-of-reversion-why-your-variegated-monstera-is-turning-green-and-how-to-save-it:
  eyebrow: "Problems & fixes"
  quick_answer: "One greener leaf is not enough to prove reversion. Check the newest stem, node and active growth point. Several solid-green leaves plus an all-green stem section are much stronger evidence that the vine has reverted."
  quick_points:
    - "Judge the stem and growth point, not one leaf."
    - "More light can support the plant but cannot recreate missing variegated tissue."
    - "Corrective pruning targets a lower node whose bud still intersects variegated stem tissue."
  visual_cards_title: "What true reversion looks like"
  visual_cards:
    - title: "Healthy mixed variegation"
      text: "Green and cream tissue continue through leaves and stem."
      image: "/images/monstera-variegated-hero.jpg"
    - title: "Greener new growth"
      text: "One greener leaf can still be normal variation; look for a repeated pattern."
      image: "/images/monstera-reverted-green.jpg"
    - title: "Read the stem"
      text: "Follow striping through the internodes and across the buds."
      image: "/images/variegation-pattern-close.jpg"
    - title: "Choose the next node"
      text: "If pruning is needed, protect the lower node and axillary bud you want to activate."
      image: "/images/monstera-node-vs-axillary-bud-comparison.webp"
  action_title: "Confirm first, then decide whether to cut"
  action_steps:
    - title: "Check two or more leaves"
      text: "Do not react to a single greener leaf. Look for a trend."
      image: "/images/monstera-reverted-green.jpg"
    - title: "Trace the stem"
      text: "Find the last node where useful variegation still crosses the growth tissue."
      image: "/images/variegation-pattern-close.jpg"
    - title: "Inspect the bud"
      text: "Choose a lower bud that sits in mixed green-and-variegated stem tissue."
      image: "/images/monstera-node-vs-axillary-bud-comparison.webp"
    - title: "Keep aftercare stable"
      text: "Return the plant to bright indirect light and avoid changing every care variable at once."
      image: "/images/plant-bright-window-light.jpg"
  mistakes:
    - title: "Removing every green leaf"
      text: "The growth point matters more than the existing leaf blade."
    - title: "Trying to force variegation with fertilizer"
      text: "Fertilizer supports growth but cannot create missing variegated cells."
    - title: "Assuming more light reverses genetics"
      text: "Light helps energy balance; it does not turn a fully green bud variegated."
    - title: "Cutting before reading the node"
      text: "A rushed cut can remove the exact growth point you needed to keep."
  visual_links:
