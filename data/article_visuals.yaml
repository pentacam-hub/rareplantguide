      image: "/images/chunky-aroid-soil-mix.jpg"

is-sphagnum-moss-actually-the-holy-grail-for-rare-plant-propagation:
  eyebrow: "Propagation medium"
  quick_answer: "Sphagnum works because it can hold moisture while still leaving air around a cutting — but only when it stays loose and lightly damp. Compressed, saturated moss turns the main advantage into a rot risk."
  quick_points:
    - "Moisten the moss, then squeeze out excess water."
    - "Keep fibers loose around the node."
    - "Inspect the node regularly instead of burying it deeply."
  visual_cards_title: "Moist is useful; saturated is not"
  visual_cards:
    - title: "Loose long-fiber moss"
      text: "Air pockets are part of why sphagnum works."
      image: "/images/is-sphagnum-moss-actually-the-holy-grail-for-rare-plant-propagation.jpg"
    - title: "Visible node"
      text: "Keep the growth tissue accessible enough to inspect for softening or rot."
      image: "/images/plant-propagation-cutting.jpg"
    - title: "Developing roots"
      text: "Healthy pale roots are a better progress signal than a fixed calendar."
      image: "/images/propagation-water-rooting.jpg"
    - title: "Transition to soil"
      text: "Move established roots into a small pot with an airy aroid mix."
      image: "/images/chunky-aroid-soil-mix.jpg"
  action_steps:
    - title: "Hydrate the moss"
      text: "Wet it completely, then squeeze until it is damp rather than dripping."
      image: "/images/is-sphagnum-moss-actually-the-holy-grail-for-rare-plant-propagation.jpg"
    - title: "Place the node loosely"
      text: "Do not compress moss tightly around living stem tissue."
      image: "/images/plant-propagation-cutting.jpg"
    - title: "Watch the node"
      text: "Check firmness, smell and root development before problems spread."
      image: "/images/propagation-water-rooting.jpg"
    - title: "Pot when established"
      text: "Use a chunky mix after several healthy roots have formed."
      image: "/images/chunky-aroid-soil-mix.jpg"
  mistakes:
    - title: "Keeping moss dripping wet"
      text: "Excess water reduces air around the node."
    - title: "Burying the whole cutting"
      text: "The node becomes harder to inspect and can stay too wet."
    - title: "Never refreshing stale conditions"
      text: "Debris, stagnant moisture and poor airflow raise rot risk."
    - title: "Moving to soil too early"
      text: "Give the cutting enough roots to handle a change in moisture balance."
