<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2XPYDX7QRW"></script>
<script>
  window.dataLayer = window.dataLayer || [];

<!-- Search/browser identity: one stable, crawlable site icon and consistent site name. -->
<link rel="icon" type="image/png" sizes="256x256" href="/images/leaf-icon.png">
<link rel="shortcut icon" type="image/png" href="/images/leaf-icon.png">
<link rel="apple-touch-icon" href="/images/leaf-icon.png">
<meta property="og:site_name" content="The Rare Plant Guide">

<style>
/* Buying-guide criteria cards: shared hard override for Grow Lights + Plant Stands. */
.buying-page .criteria-grid{
  display:grid!important;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr))!important;
  gap:16px!important;
}
.buying-page .criterion-card{
  display:grid!important;
  grid-template-columns:minmax(0,1fr) auto!important;
  column-gap:12px!important;
  row-gap:10px!important;
  align-items:start!important;
  min-width:0!important;
  padding:18px!important;
  position:relative!important;
}
.buying-page .criterion-card strong{
  grid-column:1!important;
  display:block!important;
  min-width:0!important;
  padding-right:0!important;
  margin:0!important;
  font-size:1.05rem!important;
  line-height:1.28!important;
  overflow-wrap:normal!important;
  word-break:normal!important;
  hyphens:none!important;
}
.buying-page .criterion-card>span{
  grid-column:2!important;
  position:static!important;
  inset:auto!important;
  display:inline-flex!important;
  align-items:center!important;
  justify-content:center!important;
  width:max-content!important;
  max-width:none!important;
  margin:0!important;
  padding:6px 9px!important;
  white-space:nowrap!important;
  flex:0 0 auto!important;
}
.buying-page .criterion-card p{
  grid-column:1/-1!important;
  margin:0!important;
  font-size:.96rem!important;
  line-height:1.55!important;
}
@media(max-width:600px){
  .buying-page .criteria-grid{grid-template-columns:1fr!important;gap:12px!important;}
  .buying-page .criterion-card{padding:16px!important;}
}
</style>

{{- if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "The Rare Plant Guide",
  "alternateName": "Rare Plant Guide",
  "url": "https://therareplantguide.com/",
  "description": "Rare houseplant care and troubleshooting guides for Monstera, Philodendron, Anthurium and other aroids.",
  "publisher": {
    "@type": "Organization",
    "name": "The Rare Plant Guide",
    "url": "https://therareplantguide.com/",
    "logo": "https://therareplantguide.com/images/leaf-icon.png"
  }
}
</script>
{{- end }}

{{- if and .IsSection (eq .Section "posts") }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "CollectionPage",
  "name": {{ .Title | jsonify | safeJS }},
  "url": {{ .Permalink | jsonify | safeJS }},
  "description": {{ .Description | jsonify | safeJS }},
  "isPartOf": {
    "@type": "WebSite",
    "name": "The Rare Plant Guide",
    "url": "https://therareplantguide.com/"
  }
}
</script>
{{- end }}

{{- if and .IsPage .Params.faq }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {{- range $i, $item := .Params.faq }}
    {{- if $i }},{{ end }}
    {
      "@type": "Question",
      "name": {{ $item.question | jsonify | safeJS }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ $item.answer | jsonify | safeJS }}
      }
    }
    {{- end }}
  ]
}
</script>
{{- end }}
