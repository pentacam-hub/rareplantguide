name: Connect AMI via Production Pinterest App

on:
  workflow_dispatch:
    inputs:
      authorization_code:
        description: 'Temporary code from therareplantguide.com/pinterest-callback'
        required: true
        type: string

permissions:
  contents: write

jobs:
  connect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mask temporary OAuth code
        env:
          AUTH_CODE: ${{ inputs.authorization_code }}
        run: echo "::add-mask::$AUTH_CODE"

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - run: pip install pyyaml==6.0.2 requests==2.32.3 Pillow==10.4.0

      - name: Exchange production-app OAuth code, verify AMI account and publish two Pins
        env:
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_AUTHORIZATION_CODE: ${{ inputs.authorization_code }}
          TOKEN_FILE: ${{ runner.temp }}/ami_rpg_pinterest_refresh_token
        shell: python
        run: |
          import base64
          import datetime
          import os
          import sys
          import requests
          sys.path.insert(0, os.getcwd())
          import scripts.ami_pinterest as ami

          APP_ID = '1597425'
          REDIRECT_URI = 'https://therareplantguide.com/pinterest-callback'
          EXPECTED_BOARDS = {
              '1099 tax tips',
              'w-2 vs 1099',
              'contractor rates & salary calculators',
          }
          TARGET_IDS = ['ami-013', 'ami-014']

          secret = os.environ.get('PINTEREST_APP_SECRET')
          code = os.environ.get('PINTEREST_AUTHORIZATION_CODE', '').strip()
          token_file = os.environ['TOKEN_FILE']
          if not secret or not code:
              raise SystemExit('Missing production Pinterest app secret or authorization code.')

          basic = base64.b64encode(f'{APP_ID}:{secret}'.encode()).decode()
          token_response = requests.post(
              'https://api.pinterest.com/v5/oauth/token',
              headers={
                  'Authorization': f'Basic {basic}',
                  'Content-Type': 'application/x-www-form-urlencoded',
              },
              data={
                  'grant_type': 'authorization_code',
                  'code': code,
                  'redirect_uri': REDIRECT_URI,
                  'continuous_refresh': 'true',
              },
              timeout=30,
          )
          if not token_response.ok:
              print('Pinterest token exchange:', token_response.status_code, token_response.text[:2000])
              token_response.raise_for_status()
          token_payload = token_response.json()
          access_token = token_payload.get('access_token')
          refresh_token = token_payload.get('refresh_token')
          if not access_token or not refresh_token:
              raise SystemExit('Pinterest did not return both access and refresh tokens.')

          granted = set(str(token_payload.get('scope', '')).replace(',', ' ').split())
          required = {'boards:read', 'boards:write', 'pins:read', 'pins:write'}
          missing = sorted(required - granted)
          if missing:
              raise SystemExit('Missing Pinterest scopes: ' + ', '.join(missing))

          headers = {'Authorization': f'Bearer {access_token}'}
          found = set()
          board_map = {}
          bookmark = None
          for _ in range(5):
              params = {'page_size': 100}
              if bookmark:
                  params['bookmark'] = bookmark
              response = requests.get(
                  'https://api.pinterest.com/v5/boards',
                  headers=headers,
                  params=params,
                  timeout=30,
              )
              if not response.ok:
                  print('Pinterest boards response:', response.status_code, response.text[:2000])
                  response.raise_for_status()
              payload = response.json()
              for board in payload.get('items', []):
                  name = str(board.get('name') or '').strip().lower()
                  board_map[name] = board
                  if name in EXPECTED_BOARDS:
                      found.add(name)
              if len(found) >= 2:
                  break
              bookmark = payload.get('bookmark')
              if not bookmark:
                  break

          if len(found) < 2:
              raise SystemExit(
                  'Wrong Pinterest account: fewer than two known Analyze My Income boards were found. '
                  'Nothing published.'
              )
          print('Analyze My Income account verified by boards:', ', '.join(sorted(found)))

          fd = os.open(token_file, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(fd, 'w', encoding='utf-8') as handle:
              handle.write(refresh_token)

          queue = ami.load_queue()
          pins_by_id = {pin.get('id'): pin for pin in queue.get('pins', [])}
          published = []

          for target_id in TARGET_IDS:
              pin = pins_by_id.get(target_id)
              if not pin:
                  raise SystemExit(f'Missing target Pin {target_id} from queue.')
              if pin.get('status') == 'posted' and pin.get('pinterest_pin_id'):
                  published.append((target_id, str(pin['pinterest_pin_id'])))
                  continue

              board_name = pin['board'].strip().lower()
              board = board_map.get(board_name)
              if not board:
                  create_board = requests.post(
                      'https://api.pinterest.com/v5/boards',
                      headers={**headers, 'Content-Type': 'application/json'},
                      json={
                          'name': pin['board'],
                          'description': (pin.get('board_description') or '')[:500],
                      },
                      timeout=30,
                  )
                  if not create_board.ok:
                      print('Create board response:', create_board.status_code, create_board.text[:2000])
                      create_board.raise_for_status()
                  board = create_board.json()
                  board_map[board_name] = board

              existing = ami.find_existing_pin(access_token, pin['destination'], pin['title'])
              if existing:
                  result = existing
                  print(f'Existing Pin reused for {target_id}: {result.get("id")}')
              else:
                  image_path = ami.build_pin_image(pin)
                  payload = {
                      'board_id': board['id'],
                      'media_source': ami.build_media_source(image_path),
                      'link': pin['destination'],
                      'title': pin['title'][:100],
                      'description': pin['description'][:800],
                      'alt_text': ami.build_alt_text(pin),
                  }
                  response = requests.post(
                      'https://api.pinterest.com/v5/pins',
                      headers={**headers, 'Content-Type': 'application/json'},
                      json=payload,
                      timeout=60,
                  )
                  if not response.ok:
                      print(f'Create Pin {target_id}:', response.status_code, response.text[:4000])
                      response.raise_for_status()
                  result = response.json()
                  print(f'Published {target_id}: {result.get("id")}')

              pin['status'] = 'posted'
              pin['pinterest_pin_id'] = result.get('id')
              pin['published_date'] = datetime.date.today().isoformat()
              published.append((target_id, str(result.get('id'))))

          ami.save_queue(queue)
          print('PUBLISHED_IDS=' + ','.join(f'{pid}:{pin_id}' for pid, pin_id in published))

      - name: Save AMI token for production Pinterest app
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
          TOKEN_FILE: ${{ runner.temp }}/ami_rpg_pinterest_refresh_token
        run: |
          if [ -s "$TOKEN_FILE" ]; then
            gh secret set AMI_RPG_PINTEREST_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$TOKEN_FILE"
            echo "AMI production-app Pinterest refresh token saved securely."
          fi

      - name: Commit published Pin IDs
        if: success()
        run: |
          git config user.name "analyzemyincome-pinterest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add ami-pinterest-queue.yaml
          if ! git diff --staged --quiet; then
            git commit -m "Auto: publish AMI Pins via production Pinterest app"
            git pull --rebase origin main
            git push
          fi
