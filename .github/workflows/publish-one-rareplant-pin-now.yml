name: Publish One Rare Plant Pin Now

on:
  push:
    paths:
      - '.github/publish-one-rareplant-pin.trigger'

permissions:
  contents: write

jobs:
  publish-one:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Publish exactly one pending Rare Plant Pin
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_REFRESH_TOKEN_FILE: ${{ runner.temp }}/pinterest_refresh_token
        run: python3 -m scripts.post_pin --max-pins 1

      - name: Record published Pin ID
        run: |
          git config user.name "rareplantguide-pinterest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content-queue.yaml
          if ! git diff --staged --quiet; then
            git commit -m "Auto: publish one Rare Plant Pinterest Pin"
            git pull --rebase origin main
            git push origin main
          fi
