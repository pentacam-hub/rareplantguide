name: Publish AMI Pins Now

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ami-pinterest-now.yml

permissions:
  contents: write

jobs:
  publish-two:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml==6.0.2 requests==2.32.3 Pillow==10.4.0

      - name: Verify AMI account by existing Pins and publish exactly two
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
        shell: python
        run: |
          import base64
          import datetime
          import os
          import sys
          import requests
          sys.path.insert(0, os.getcwd())
          import scripts.ami_pinterest as ami

          app_id = os.environ.get('PINTEREST_APP_ID')
          app_secret = os.environ.get('PINTEREST_APP_SECRET')
          refresh_token = os.environ.get('PINTEREST_REFRESH_TOKEN')
          if not app_id or not app_secret:
              raise SystemExit('Pinterest app credentials are missing.')

          known_ami_ids = {
              '879961214758040904',
              '879961214758062627',
              '879961214758071343',
              '879961214758092251',
          }

          def visible_ami_ids(access_token):
              headers = {'Authorization': f'Bearer {access_token}'}
              bookmark = None
              found = set()
              for _ in range(5):
                  params = {'page_size': 100}
                  if bookmark:
                      params['bookmark'] = bookmark
                  response = requests.get(
                      'https://api.pinterest.com/v5/pins',
                      headers=headers,
                      params=params,
                      timeout=20,
                  )
                  if not response.ok:
                      return set()
                  payload = response.json()
                  for item in payload.get('items', []):
                      pin_id = str(item.get('id') or '')
                      if pin_id in known_ami_ids:
                          found.add(pin_id)
                  bookmark = payload.get('bookmark')
                  if not bookmark or found:
                      break
              return found

          basic = base64.b64encode(f'{app_id}:{app_secret}'.encode()).decode()
          basic_headers = {
              'Authorization': f'Basic {basic}',
              'Content-Type': 'application/x-www-form-urlencoded',
          }

          token = None
          auth_mode = None
          verified_ids = set()

          client_response = requests.post(
              'https://api.pinterest.com/v5/oauth/token',
              headers=basic_headers,
              data={
                  'grant_type': 'client_credentials',
                  'scope': 'boards:read,boards:write,pins:read,pins:write',
              },
              timeout=20,
          )
          if client_response.ok:
              candidate = client_response.json()['access_token']
              visible = visible_ami_ids(candidate)
              if visible:
                  token = candidate
                  auth_mode = 'client_credentials'
                  verified_ids = visible

          if token is None and refresh_token:
              refresh_response = requests.post(
                  'https://api.pinterest.com/v5/oauth/token',
                  headers=basic_headers,
                  data={
                      'grant_type': 'refresh_token',
                      'refresh_token': refresh_token,
                      'scope': 'boards:read,boards:write,pins:read,pins:write',
                  },
                  timeout=20,
              )
              refresh_response.raise_for_status()
              candidate = refresh_response.json()['access_token']
              visible = visible_ami_ids(candidate)
              if visible:
                  token = candidate
                  auth_mode = 'refresh_token'
                  verified_ids = visible

          if token is None:
              raise SystemExit('Available Pinterest credentials cannot see any known Analyze My Income Pin. Nothing published.')

          print(f'AMI Pinterest ownership verified via {auth_mode}; matched existing Pin IDs: {sorted(verified_ids)}')

          queue = ami.load_queue()
          wanted = ['ami-013', 'ami-014']
          pins = {pin.get('id'): pin for pin in queue.get('pins', [])}
          published = []

          for pin_id in wanted:
              pin = pins.get(pin_id)
              if not pin:
                  raise SystemExit(f'Missing queue item {pin_id}')
              if pin.get('status') == 'posted' and pin.get('pinterest_pin_id'):
                  published.append((pin_id, str(pin['pinterest_pin_id'])))
                  continue

              board_id = ami.get_or_create_board(
                  token,
                  pin['board'],
                  pin.get('board_description') or 'Analyze My Income calculators and money planning tools.',
              )
              existing = ami.find_existing_pin(token, pin['destination'], pin['title'])
              if existing:
                  result = existing
                  print(f'Existing Pinterest Pin found for {pin_id}: {result.get("id")}')
              else:
                  image_path = ami.build_pin_image(pin)
                  result = ami.create_pin(token, board_id, pin, image_path)
                  print(f'Published {pin_id}: {result.get("id")}')

              pin['status'] = 'posted'
              pin['pinterest_pin_id'] = result.get('id')
              pin['published_date'] = datetime.date.today().isoformat()
              published.append((pin_id, str(result.get('id'))))

          ami.save_queue(queue)
          print('PUBLISHED_IDS=' + ','.join(f'{pid}:{pinid}' for pid, pinid in published))

      - name: Restore normal AMI queue and commit Pin IDs
        run: |
          python - <<'PY'
          import yaml
          path = 'ami-pinterest-queue.yaml'
          with open(path, encoding='utf-8') as f:
              data = yaml.safe_load(f)
          for pin in data.get('pins', []):
              if pin.get('id') in {'ami-005','ami-006','ami-007','ami-008','ami-009','ami-010','ami-011','ami-012'} and pin.get('status') == 'hold':
                  pin['status'] = 'pending'
          with open(path, 'w', encoding='utf-8') as f:
              yaml.safe_dump(data, f, allow_unicode=True, sort_keys=False, width=120)
          PY
          git config user.name "analyzemyincome-pinterest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add ami-pinterest-queue.yaml
          git commit -m "Auto: record two Analyze My Income Pinterest Pins"
          git pull --rebase origin main
          git push
