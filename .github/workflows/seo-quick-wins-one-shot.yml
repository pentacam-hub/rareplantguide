name: SEO Quick Wins One Shot

on:
  push:
    paths:
      - '.github/workflows/seo-quick-wins-one-shot.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.148.2'
          extended: true
      - name: Apply CTR-focused SEO updates
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
            'content/posts/the-heartbreak-of-reversion-why-your-variegated-monstera-is-turning-green-and-how-to-save-it.md': [
              ('title: "Variegated Monstera Turning Green? How to Stop Reversion"', 'title: "Variegated Monstera Turning Green? Can Reversion Be Reversed?"'),
              ('description: "Monstera reversion guide for a variegated Monstera turning green: check the stem and node, learn when to prune, protect variegation, and avoid common mistakes."', 'description: "Is your Monstera Albo turning green? Learn the signs of true reversion, when to prune, which node to keep, and whether variegation can return."'),
              ('lastmod: 2026-08-28', 'lastmod: 2026-08-29'),
            ],
            'content/posts/best-soil-mix-variegated-monstera.md': [
              ('title: "Best Soil Mix for Variegated Monstera: 40/30/20/10 Recipe"', 'title: "Best Soil for Variegated Monstera: Exact 40/30/20/10 Mix"'),
              ('description: "Best soil mix for variegated Monstera Albo and Thai Constellation: 40% bark, 30% perlite or pumice, 20% coco or sphagnum, and 10% potting mix or castings."', 'description: "Use this exact 40/30/20/10 soil mix for Monstera Albo and Thai Constellation, plus simple adjustments for humidity, pot type and watering speed."'),
              ('lastmod: 2026-08-28', 'lastmod: 2026-08-29'),
            ],
            'content/posts/how-much-light-do-your-rare-aroids-actually-need-a-real-talk-guide-to-happy-leaves.md': [
              ('title: "How Much Light Do Rare Aroids Need? Indoor Light Guide"', 'title: "How Much Light Do Rare Aroids Need? 100–800 FC Chart"'),
              ('description: "How much light do rare aroids need? Compare practical 100–800 FC indoor ranges for Monstera, Philodendron, Anthurium and Alocasia, plus grow-light timing."', 'description: "See a practical 100–800 FC light chart for Monstera, Philodendron, Anthurium and Alocasia, plus signs of too little light and grow-light timing."'),
              ('lastmod: 2026-08-25', 'lastmod: 2026-08-29'),
              ('For choosing and positioning a fixture, see [Best Grow Lights for Rare Houseplants](/posts/best-grow-lights-rare-houseplants/).', 'For choosing and positioning a fixture, see [Best Grow Lights for Rare Houseplants](/posts/best-grow-lights-rare-houseplants/).\n\n**Need a fixture now?** Compare our [3 grow-light picks for 2026](/buying-guides/best-selling-grow-lights/) with product-by-product setup notes and recent tracked prices.'),
            ],
            'content/posts/pests-rare-houseplants.md': [
              ('title: "Rare Houseplant Pests: Spider Mites, Thrips, Mealybugs & Scale"', 'title: "Rare Houseplant Pests: Spider Mites, Thrips & More (ID Chart)"'),
              ('description: "Identify rare houseplant pests fast: compare spider-mite webbing, thrips silver streaks, mealybug cottony clusters and scale bumps, plus treatment steps."', 'description: "Use this quick rare-houseplant pest ID chart to spot spider mites, thrips, mealybugs and scale, then follow the right isolation and treatment steps."'),
              ('lastmod: 2026-08-25', 'lastmod: 2026-08-29'),
            ],
            'content/posts/best-grow-lights-rare-houseplants.md': [
              ('title: "Best Grow Lights for Rare Houseplants: 2026 Setup Guide"', 'title: "Grow Lights for Rare Houseplants: Distance, Timing & Setup"'),
              ('description: "Best grow lights for rare and variegated houseplants: compare full-spectrum LEDs, coverage, intensity, mounting distance and 10–14 hour timing for indoor aroids."', 'description: "Set up grow lights for rare houseplants correctly: learn mounting distance, coverage, intensity, 10–14 hour timing and signs the light is too weak or strong."'),
              ('lastmod: 2026-08-28', 'lastmod: 2026-08-29'),
              ('For measured light ranges rather than product selection, use the companion guide: [How Much Light Do Rare Aroids Need?](/posts/how-much-light-do-your-rare-aroids-actually-need-a-real-talk-guide-to-happy-leaves/).', 'For measured light ranges rather than product selection, use the companion guide: [How Much Light Do Rare Aroids Need?](/posts/how-much-light-do-your-rare-aroids-actually-need-a-real-talk-guide-to-happy-leaves/).\n\n**Shopping now?** Compare our [3 best grow-light picks for 2026](/buying-guides/best-selling-grow-lights/) with quick product comparisons and recent tracked prices.'),
            ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Missing expected text in {filename}: {old[:80]}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
              print('updated', filename)
          PY
      - name: Validate Hugo build
        run: bash scripts/cloudflare-build.sh
      - name: Commit optimized pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts/
          git commit -m "SEO: improve CTR on top-ranking rare plant pages"
          git push
