name: Connect Analyze My Income Pinterest

on:
  workflow_dispatch:
    inputs:
      authorization_code:
        description: 'Temporary Pinterest authorization code from analyzemyincome.com/pinterest-callback'
        required: true
        type: string

permissions:
  contents: write

jobs:
  connect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mask temporary Pinterest authorization code
        env:
          PINTEREST_AUTHORIZATION_CODE: ${{ inputs.authorization_code }}
        run: echo "::add-mask::$PINTEREST_AUTHORIZATION_CODE"

      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install publisher dependencies
        run: pip install pyyaml==6.0.2 requests==2.32.3 Pillow==10.4.0

      - name: Check required Pinterest app secrets
        env:
          AMI_PINTEREST_APP_SECRET: ${{ secrets.AMI_PINTEREST_APP_SECRET }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          missing=0
          for name in AMI_PINTEREST_APP_SECRET GH_SECRETS_PAT; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Exchange code and verify Analyze My Income Pinterest account
        id: exchange
        env:
          PINTEREST_APP_ID: '1604082'
          PINTEREST_APP_SECRET: ${{ secrets.AMI_PINTEREST_APP_SECRET }}
          PINTEREST_AUTHORIZATION_CODE: ${{ inputs.authorization_code }}
          EXPECTED_PINTEREST_USERNAME: iserviceseood
          REDIRECT_URI: https://analyzemyincome.com/pinterest-callback
          TOKEN_FILE: ${{ runner.temp }}/ami_pinterest_refresh_token
        shell: python
        run: |
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          app_id = os.environ['PINTEREST_APP_ID']
          app_secret = os.environ['PINTEREST_APP_SECRET']
          code = os.environ['PINTEREST_AUTHORIZATION_CODE'].strip()
          expected_username = os.environ['EXPECTED_PINTEREST_USERNAME'].strip().lstrip('@').lower()
          redirect_uri = os.environ['REDIRECT_URI']
          token_file = os.environ['TOKEN_FILE']

          if not code:
              raise SystemExit('Pinterest authorization code is empty.')

          credentials = base64.b64encode(f'{app_id}:{app_secret}'.encode()).decode()
          body = urllib.parse.urlencode({
              'grant_type': 'authorization_code',
              'code': code,
              'redirect_uri': redirect_uri,
              'continuous_refresh': 'true',
          }).encode()
          request = urllib.request.Request(
              'https://api.pinterest.com/v5/oauth/token',
              data=body,
              headers={
                  'Authorization': f'Basic {credentials}',
                  'Content-Type': 'application/x-www-form-urlencoded',
              },
              method='POST',
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.loads(response.read().decode())
          except Exception as exc:
              raise SystemExit(f'Pinterest token exchange failed: {exc}')

          access_token = payload.get('access_token')
          refresh_token = payload.get('refresh_token')
          granted_scope = payload.get('scope', '')
          if not access_token or not refresh_token:
              raise SystemExit('Pinterest did not return the required OAuth tokens.')

          required = {'user_accounts:read', 'boards:read', 'boards:write', 'pins:read', 'pins:write'}
          normalized = set(str(granted_scope).replace(',', ' ').split())
          missing = sorted(required - normalized)
          if missing:
              raise SystemExit('Pinterest token is missing required scopes: ' + ', '.join(missing))

          account_request = urllib.request.Request(
              'https://api.pinterest.com/v5/user_account',
              headers={'Authorization': f'Bearer {access_token}'},
              method='GET',
          )
          try:
              with urllib.request.urlopen(account_request, timeout=30) as response:
                  account = json.loads(response.read().decode())
          except Exception as exc:
              raise SystemExit(f'Pinterest profile identity check failed: {exc}')

          actual_username = str(account.get('username') or '').strip().lstrip('@').lower()
          if actual_username != expected_username:
              raise SystemExit(
                  f'WRONG PINTEREST PROFILE: authorized @{actual_username or "unknown"}, '
                  f'expected @{expected_username}. Nothing published.'
              )

          fd = os.open(token_file, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(fd, 'w', encoding='utf-8') as handle:
              handle.write(refresh_token)

          print(f'Pinterest profile verified: @{actual_username}')
          print('Required profile/board/pin scopes verified.')
          if payload.get('refresh_token_expires_at'):
              print('Continuous refresh token enabled.')

      - name: Validate Analyze My Income Pinterest publisher
        run: python -m unittest scripts.test_ami_pinterest

      - name: Publish exactly two Analyze My Income Pins
        env:
          AMI_PINTEREST_APP_ID: '1604082'
          AMI_PINTEREST_APP_SECRET: ${{ secrets.AMI_PINTEREST_APP_SECRET }}
          TOKEN_FILE: ${{ runner.temp }}/ami_pinterest_refresh_token
        run: |
          for n in 1 2; do
            export AMI_PINTEREST_REFRESH_TOKEN="$(cat "$TOKEN_FILE")"
            export AMI_PINTEREST_REFRESH_TOKEN_FILE="$TOKEN_FILE"
            echo "Publishing Analyze My Income Pin $n of 2..."
            python scripts/ami_pinterest.py
          done

      - name: Save final Analyze My Income refresh token as GitHub secret
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
          TOKEN_FILE: ${{ runner.temp }}/ami_pinterest_refresh_token
        run: |
          test -s "$TOKEN_FILE"
          gh secret set AMI_PINTEREST_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$TOKEN_FILE"
          echo "AMI_PINTEREST_REFRESH_TOKEN saved securely after publication."

      - name: Commit Analyze My Income Pin IDs
        run: |
          git config user.name "analyzemyincome-pinterest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add ami-pinterest-queue.yaml
          if ! git diff --staged --quiet; then
            git commit -m "Auto: publish two Analyze My Income Pinterest Pins"
            git pull --rebase origin main
            git push
          else
            echo "No Analyze My Income Pinterest queue update to save."
          fi

      - name: Connection and publication complete
        run: |
          echo "Analyze My Income Pinterest OAuth connection completed for @iserviceseood."
          echo "Two Analyze My Income Pins were processed and their IDs recorded in the queue."
