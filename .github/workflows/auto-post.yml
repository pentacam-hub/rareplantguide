name: Pinterest + Content Agent (weekly)

on:
  workflow_dispatch: {}
  schedule:
    # One new article + Pinterest creative every Monday at 08:20 Italy time.
    # Keep the manual trigger as a fallback.
    - cron: '20 8 * * 1'
      timezone: "Europe/Rome"

permissions:
  contents: write

concurrency:
  group: rareplantguide-pinterest-publisher
  cancel-in-progress: true

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run weekly content agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          GITHUB_CONTENT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/cloudflare-agent-build.sh
