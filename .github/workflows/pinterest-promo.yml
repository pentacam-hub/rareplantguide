name: Pinterest Evergreen Promo

on:
  schedule:
    # Second daily Pin: 14:30 UTC.
    # This catches late morning US East; the original Pin runs later for US West.
    - cron: '30 14 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rareplantguide-pinterest-publisher
  cancel-in-progress: false

jobs:
  evergreen-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check required secrets
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
        run: |
          missing=0
          for name in PINTEREST_APP_ID PINTEREST_APP_SECRET PINTEREST_REFRESH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Validate Pinterest code
        run: python -m unittest scripts.test_post_pin scripts.test_post_promo_pin scripts.test_wait_for_deploy

      - name: Prepare evergreen Pin creative
        run: python scripts/post_promo_pin.py --prepare

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.148.2'
          extended: true

      - name: Build production site
        run: hugo --minify

      - name: Commit and push evergreen creative and site
        run: |
          git config user.name "rareplantguide-bot"
          git config user.email "bot@users.noreply.github.com"
          git add static/images/pins/ content-queue.yaml public/
          if ! git diff --staged --quiet; then
            git commit -m "Auto: prepare evergreen Pinterest Pin"
            git pull --rebase origin main
            git push
          else
            echo "No new evergreen Pin creative to publish."
          fi

      - name: Wait for evergreen Pin assets
        run: python -m scripts.wait_for_deploy --kind promo --max-pins 1 --timeout 600 --interval 15

      - name: Publish evergreen Pinterest Pin
        id: publish_pin
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_REFRESH_TOKEN_FILE: ${{ runner.temp }}/pinterest_refresh_token
        run: python scripts/post_promo_pin.py --publish

      - name: Rotate Pinterest refresh token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
          TOKEN_FILE: ${{ runner.temp }}/pinterest_refresh_token
        run: |
          if [ ! -s "$TOKEN_FILE" ]; then
            echo "Client Credentials used or no rotated refresh token returned."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::A fallback refresh token rotated but GH_SECRETS_PAT is not configured."
            exit 0
          fi
          gh secret set PINTEREST_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$TOKEN_FILE"
          echo "Fallback Pinterest refresh token updated securely."

      - name: Commit evergreen Pin status
        if: steps.publish_pin.outcome == 'success'
        run: |
          git config user.name "rareplantguide-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content-queue.yaml
          if ! git diff --staged --quiet; then
            git commit -m "Auto: record evergreen Pinterest Pin"
            git pull --rebase origin main
            git push
          else
            echo "No evergreen Pin status update to save."
          fi
