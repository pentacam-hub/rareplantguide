name: Pinterest Evergreen Promo (manual fallback)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rareplantguide-pinterest-publisher
  cancel-in-progress: false

jobs:
  evergreen-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run legacy fallback evergreen agent
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          GITHUB_CONTENT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/cloudflare-promo-build.sh
