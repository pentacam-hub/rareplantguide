<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Pinterest Authorization</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fb;color:#102033;padding:24px}
    main{width:min(720px,100%);background:#fff;border:1px solid #dfe6ee;border-radius:24px;padding:32px;box-shadow:0 20px 50px rgba(16,32,51,.08)}
    h1{font-size:clamp(28px,5vw,40px);margin:0 0 12px}.ok{color:#047857}.bad{color:#b91c1c}p{color:#506174;line-height:1.55}code{display:block;word-break:break-all;background:#f8fafc;border:1px solid #dfe6ee;border-radius:14px;padding:16px;font-size:15px;color:#102033}button{width:100%;margin-top:14px;border:0;border-radius:14px;padding:14px;background:#102033;color:#fff;font-size:16px;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
<main id="app"><h1>Pinterest authorization</h1><p>Checking the callback…</p></main>
<script>
  const app = document.getElementById('app');
  const params = new URLSearchParams(location.search);
  const error = params.get('error');
  const code = params.get('code');
  const returnedState = params.get('state');
  const expectedState = sessionStorage.getItem('amiRpgPinterestOauthState');
  if (error) {
    app.innerHTML = `<h1 class="bad">Authorization failed</h1><p>${error}</p>`;
  } else if (!code) {
    app.innerHTML = '<h1 class="bad">No authorization code returned</h1><p>Start again from /ami-pinterest-connect/.</p>';
  } else if (expectedState && returnedState !== expectedState) {
    app.innerHTML = '<h1 class="bad">OAuth state check failed</h1><p>Start again from /ami-pinterest-connect/ in the same browser tab.</p>';
  } else {
    sessionStorage.removeItem('amiRpgPinterestOauthState');
    app.innerHTML = `<h1 class="ok">Authorization successful</h1><p>Copy this temporary authorization code into the GitHub workflow <strong>Connect AMI via Production Pinterest App</strong>.</p><code id="code"></code><button id="copy">Copy authorization code</button>`;
    document.getElementById('code').textContent = code;
    document.getElementById('copy').addEventListener('click', async () => {
      await navigator.clipboard.writeText(code);
      document.getElementById('copy').textContent = 'Copied';
    });
  }
</script>
</body>
</html>
